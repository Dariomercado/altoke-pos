<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>AlToke — 02 Bandeja táctil</title>
<style>
  /* Tokens: subconjunto exacto de packages/ui/src/tokens.css (claro). */
  :root {
    color-scheme: light;
    --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;

    --space-xs: .25rem; --space-sm: .5rem; --space-md: 1rem;
    --space-lg: 1.5rem; --space-xl: 2.5rem;
    --gutter-desktop: 1.5rem; --page-margin-desktop: 2rem;

    --radius-xs: .125rem; --radius-sm: .25rem; --radius-md: .5rem;
    --radius-lg: .75rem; --radius-full: 9999px;

    --size-touch-min: 2.75rem; --size-control: 3rem; --size-header: 4rem;
    --shadow-panel: 0 1px 8px rgb(0 0 0 / 4%);
    --shadow-overlay: 0 20px 25px -5px rgb(0 0 0 / 50%), 0 8px 10px -6px rgb(79 70 229 / 12%);
    --focus-ring-width: 2px;

    --brand-primary: #4d44e3; --brand-accent: #005049;
    --brand-surface: #fbf8ff; --brand-text: #1b1b21;

    --color-primary: var(--brand-primary); --color-on-primary: #ffffff;
    --color-primary-container: #e2dfff; --color-on-primary-container: #0f0069;
    --color-secondary: var(--brand-accent); --color-on-secondary: #ffffff;
    --color-secondary-container: #89f5e7; --color-on-secondary-container: #00201d;
    --color-tertiary: #005236; --color-on-tertiary: #ffffff;
    --color-tertiary-container: #6ffbbe; --color-on-tertiary-container: #002113;
    --color-error: #93000a; --color-on-error: #ffffff;
    --color-error-container: #ffdad6; --color-on-error-container: #690005;
    --color-surface: var(--brand-surface);
    --color-surface-dim: #dad9e1; --color-surface-bright: #fbf8ff;
    --color-surface-container-lowest: #ffffff;
    --color-surface-container-low: #f5f2fa;
    --color-surface-container: #efecf4;
    --color-surface-container-high: #e9e7ee;
    --color-surface-container-highest: #e4e1e9;
    --color-on-surface: var(--brand-text);
    --color-on-surface-variant: #464555;
    --color-outline: #777586; --color-outline-variant: #c7c4d8;
    --color-placeholder: var(--color-on-surface-variant);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--color-surface-container-low);
    color: var(--color-on-surface);
    font-family: var(--font-ui);
    font-size: .9375rem;
    line-height: 1.5rem;
    height: 800px; overflow: hidden;
    display: grid; grid-template-rows: auto 1fr;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  :where(:focus-visible) { outline: var(--focus-ring-width) solid var(--color-primary); outline-offset: 2px; }

  /* ── Barra superior ───────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: var(--space-md);
    height: var(--size-header); padding: 0 var(--page-margin-desktop);
    background: var(--color-surface-container-lowest);
    border-bottom: 1px solid var(--color-outline-variant);
  }
  .mark {
    width: 2.25rem; height: 2.25rem; border-radius: var(--radius-md);
    background: var(--color-primary); color: var(--color-on-primary);
    display: grid; place-items: center;
    font-family: var(--font-sans); font-weight: 700;
  }
  .who b { display: block; font-family: var(--font-sans); font-size: 1rem; line-height: 1.25rem; letter-spacing: -.01em; }
  .who span { font-size: .75rem; line-height: 1rem; color: var(--color-on-surface-variant); }
  .spacer { flex: 1; }

  .chip {
    display: inline-flex; align-items: center; gap: var(--space-sm);
    min-height: var(--size-touch-min); padding: 0 var(--space-md);
    border-radius: var(--radius-full);
    background: var(--color-tertiary-container); color: var(--color-on-tertiary-container);
    font-size: .75rem; font-weight: 600; letter-spacing: .02em;
  }
  .chip .dot { width: .5rem; height: .5rem; border-radius: var(--radius-full); background: var(--color-tertiary); }
  .icon-btn {
    width: var(--size-control); height: var(--size-control);
    display: grid; place-items: center;
    border: 1px solid var(--color-outline-variant); border-radius: var(--radius-md);
    background: var(--color-surface-container-lowest); cursor: pointer;
  }
  .icon-btn:hover { background: var(--color-surface-container); }

  /* ── Layout: riel de categorías + grilla ──────────────────────────── */
  .workspace { display: grid; grid-template-columns: 6.5rem 1fr; min-height: 0; }

  nav.rail {
    display: flex; flex-direction: column; gap: var(--space-sm);
    padding: var(--space-md) var(--space-sm);
    background: var(--color-surface-container-lowest);
    border-right: 1px solid var(--color-outline-variant);
  }
  .cat {
    display: grid; place-items: center; gap: 2px;
    min-height: 4.25rem; padding: var(--space-xs);
    border: 1px solid transparent; border-radius: var(--radius-md);
    background: none; cursor: pointer;
    font-size: .5625rem; line-height: .75rem; letter-spacing: .03em; font-weight: 700;
    text-transform: uppercase; color: var(--color-on-surface-variant); text-align: center;
    transition: background-color 130ms ease, transform 130ms cubic-bezier(.215,.61,.355,1);
  }
  .cat svg { width: 1.5rem; height: 1.5rem; }
  .cat:hover { background: var(--color-surface-container); }
  .cat:active { transform: scale(.96); }
  .cat[aria-current='true'] {
    background: var(--color-primary-container); color: var(--color-on-primary-container);
    border-color: var(--color-primary);
  }
  .rail .sep { height: 1px; background: var(--color-outline-variant); margin: var(--space-xs) var(--space-sm); }

  .stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; padding: var(--space-lg) var(--page-margin-desktop) 0; }

  .stage-head { display: flex; align-items: center; gap: var(--space-md); }
  .search { position: relative; flex: 1; }
  .search svg { position: absolute; left: var(--space-md); top: 50%; transform: translateY(-50%); width: 1.25rem; height: 1.25rem; color: var(--color-on-surface-variant); }
  .search input {
    width: 100%; min-height: 3.5rem; padding: 0 var(--space-md) 0 3.25rem;
    border: 1px solid var(--color-outline); border-radius: var(--radius-lg);
    background: var(--color-surface-container-lowest); font: inherit; font-size: 1rem;
  }
  .search input::placeholder { color: var(--color-placeholder); }
  .scan {
    display: flex; align-items: center; gap: var(--space-sm);
    min-height: 3.5rem; padding: 0 var(--space-lg);
    border: 0; border-radius: var(--radius-lg);
    background: var(--color-secondary-container); color: var(--color-on-secondary-container);
    font-size: .875rem; font-weight: 700; letter-spacing: .01em; cursor: pointer;
  }
  .scan:active { transform: scale(.98); }

  /* ── Tiles ────────────────────────────────────────────────────────── */
  .tiles {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-md); align-content: start;
    overflow: auto; padding: var(--space-lg) 0 var(--space-md);
  }
  .tile {
    position: relative; display: grid; gap: var(--space-xs); align-content: space-between;
    min-height: 7.25rem; padding: var(--space-md);
    text-align: left;
    background: var(--color-surface-container-lowest);
    border: 1px solid var(--color-outline-variant);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-panel);
    cursor: pointer;
    transition: transform 130ms cubic-bezier(.215,.61,.355,1), border-color 130ms ease, background-color 130ms ease;
  }
  .tile:hover { border-color: var(--color-outline); }
  .tile:active { transform: scale(.97); border-color: var(--color-primary); }
  .tile .cat-tag { font-size: .625rem; line-height: .875rem; letter-spacing: .06em; font-weight: 700; text-transform: uppercase; color: var(--color-on-surface-variant); }
  .tile .nm { font-size: .9375rem; line-height: 1.25rem; font-weight: 600; padding-right: 2rem; min-height: 2.5rem; }
  .tile .pr { font-family: var(--font-sans); font-size: 1.5rem; line-height: 2rem; letter-spacing: -.015em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .add {
    position: absolute; right: var(--space-md); top: var(--space-md);
    width: 1.75rem; height: 1.75rem; border-radius: var(--radius-full);
    display: grid; place-items: center;
    background: var(--color-primary-container); color: var(--color-on-primary-container);
    font-size: 1rem; font-weight: 700; line-height: 1;
  }
  .tile.low .pr { color: var(--color-error); padding-right: 5.5rem; }
  .tile .warn { position: absolute; right: var(--space-md); bottom: 1.15rem; font-size: .625rem; letter-spacing: .03em; font-weight: 700; color: var(--color-error); }
  /* Pulso de confirmación al agregar */
  .tile.added { animation: pop 220ms cubic-bezier(.23,1,.32,1); }
  @keyframes pop { 0% { transform: scale(.97); } 60% { transform: scale(1.015); } 100% { transform: none; } }

  /* ── Bandeja de venta ─────────────────────────────────────────────── */
  .tray {
    margin: 0 calc(var(--page-margin-desktop) * -1);
    background: var(--color-surface-container-lowest);
    border-top: 1px solid var(--color-outline-variant);
    box-shadow: 0 -8px 24px -12px rgb(0 0 0 / 18%);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    min-height: 0; max-height: 19rem;
  }
  .tray > div:nth-child(2) { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .grab { display: grid; place-items: center; height: 1.5rem; cursor: grab; }
  .grab i { display: block; width: 3rem; height: .25rem; border-radius: var(--radius-full); background: var(--color-outline-variant); }

  .tray-head { display: flex; align-items: baseline; gap: var(--space-md); padding: 0 var(--page-margin-desktop) var(--space-sm); }
  .tray-head h2 { font-family: var(--font-sans); font-size: 1.25rem; line-height: 1.75rem; letter-spacing: -.01em; font-weight: 600; margin: 0; }
  .tray-head .count {
    font-size: .75rem; font-weight: 600; letter-spacing: .02em;
    padding: .125rem var(--space-sm); border-radius: var(--radius-full);
    background: var(--color-primary-container); color: var(--color-on-primary-container);
    font-variant-numeric: tabular-nums;
  }
  .tray-head .clear { margin-left: auto; background: none; border: 0; padding: var(--space-xs); cursor: pointer; font-size: .75rem; font-weight: 600; color: var(--color-error); }
  .tray-head .clear:hover { text-decoration: underline; }

  .tray-lines { overflow: auto; min-height: 0; padding: 0 var(--page-margin-desktop);
    /* el corte de la última fila lee como "hay más abajo", no como un bug */
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 2.5rem), transparent);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 2.5rem), transparent); }
  .tl {
    display: grid; grid-template-columns: auto 1fr auto auto; align-items: center;
    gap: var(--space-md);
    padding: var(--space-sm) 0; border-top: 1px solid var(--color-outline-variant);
    animation: trayIn 170ms cubic-bezier(.215,.61,.355,1) both;
  }
  .tl .stp { display: flex; align-items: center; gap: 2px; }
  .stp button {
    width: 2rem; height: 2rem; display: grid; place-items: center;
    border: 1px solid var(--color-outline-variant); border-radius: var(--radius-md);
    background: var(--color-surface-container-low); cursor: pointer; font-size: 1rem; line-height: 1; font-weight: 700;
  }
  .stp button:active { background: var(--color-primary-container); }
  .stp .q { min-width: 1.5rem; text-align: center; font-size: .9375rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tl .nm { font-size: .9375rem; line-height: 1.25rem; }
  .tl .nm small { display: block; font-size: .75rem; color: var(--color-on-surface-variant); font-variant-numeric: tabular-nums; }
  .tl .amt { font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; min-width: 6rem; }
  .tl .rm { width: 2rem; height: 2rem; display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: var(--color-on-surface-variant); border-radius: var(--radius-md); }
  .tl .rm:hover { background: var(--color-error-container); color: var(--color-on-error-container); }
  @keyframes trayIn { from { opacity: 0; transform: translateY(.5rem); } to { opacity: 1; transform: none; } }
  .tray-empty { padding: var(--space-lg) 0; text-align: center; color: var(--color-on-surface-variant); font-size: .875rem; }

  .tray-foot { display: flex; align-items: center; gap: var(--space-lg); padding: var(--space-md) var(--page-margin-desktop); background: var(--color-surface-container-lowest); }
  .sum small { display: block; font-size: .6875rem; line-height: .875rem; letter-spacing: .04em; font-weight: 700; text-transform: uppercase; color: var(--color-on-surface-variant); }
  .sum b { font-family: var(--font-sans); font-size: 2rem; line-height: 2.5rem; letter-spacing: -.02em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sum .iva { font-size: .75rem; color: var(--color-on-surface-variant); }
  .pay-btn {
    margin-left: auto; display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-lg); min-width: 22rem; min-height: 4rem; padding: 0 var(--space-lg);
    border: 0; border-radius: var(--radius-lg);
    background: var(--color-primary); color: var(--color-on-primary);
    font-size: .875rem; font-weight: 700; letter-spacing: .04em; cursor: pointer;
    transition: transform 130ms cubic-bezier(.215,.61,.355,1), background-color 150ms ease;
  }
  .pay-btn:active { transform: scale(.985); }
  .pay-btn .v { font-size: 1.25rem; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .pay-btn:disabled { background: var(--color-surface-container-highest); color: var(--color-on-surface-variant); cursor: not-allowed; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .tile, .pay-btn, .cat { transition: none; }
    .tile.added, .tl { animation: none; }
    .tile:active, .pay-btn:active, .cat:active { transform: none; }
  }
</style>
</head>

<script>
  const fmt = n => '$ ' + n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const short = n => '$ ' + n.toLocaleString('es-AR');
  const items = new Map([
    ['Coca-Cola 500 ml', { qty: 2, price: 3200 }],
    ['Alfajor Triple Guaymallén', { qty: 1, price: 1800 }],
    ['Papas Lays Clásicas 90 g', { qty: 1, price: 2900 }],
    ['Marlboro Box 20', { qty: 1, price: 4500 }],
  ]);
  const trayLines = document.getElementById('tray-lines');
  const countEl = document.getElementById('count');
  const totalEl = document.getElementById('total');
  const ivaEl = document.getElementById('iva');
  const payEl = document.getElementById('pay');
  const payAmount = document.getElementById('pay-amount');

  function render() {
    let total = 0, count = 0;
    trayLines.innerHTML = '';
    for (const [name, it] of items) {
      total += it.qty * it.price; count += it.qty;
      const el = document.createElement('div');
      el.className = 'tl';
      el.innerHTML = `<span class="stp">
          <button type="button" aria-label="Quitar uno de ${name}" data-step="${name}" data-dir="-1">−</button>
          <span class="q num">${it.qty}</span>
          <button type="button" aria-label="Agregar uno de ${name}" data-step="${name}" data-dir="1">+</button>
        </span>
        <span class="nm"></span>
        <span class="amt num">${fmt(it.qty * it.price)}</span>
        <button class="rm" type="button" aria-label="Quitar ${name} de la venta" data-rm="${name}">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>`;
      const nm = el.querySelector('.nm');
      nm.textContent = name;
      const small = document.createElement('small');
      small.textContent = fmt(it.price) + ' c/u';
      nm.appendChild(small);
      trayLines.appendChild(el);
    }
    if (!items.size) trayLines.innerHTML = '<p class="tray-empty">La venta está vacía. Tocá un producto para agregarlo.</p>';
    countEl.textContent = `${count} ${count === 1 ? 'ítem' : 'ítems'}`;
    totalEl.textContent = fmt(total);
    ivaEl.textContent = `IVA 21% incluido · ${fmt(Math.round((total - total / 1.21) * 100) / 100)}`;
    payAmount.textContent = fmt(total);
    payEl.disabled = count === 0;
  }

  document.getElementById('tiles').addEventListener('click', e => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    const name = tile.dataset.name, price = Number(tile.dataset.price);
    const it = items.get(name) || { qty: 0, price };
    it.qty += 1; items.set(name, it);
    tile.classList.remove('added');
    void tile.offsetWidth;
    tile.classList.add('added');
    render();
  });

  trayLines.addEventListener('click', e => {
    const step = e.target.closest('[data-step]');
    const rm = e.target.closest('[data-rm]');
    if (step) {
      const it = items.get(step.dataset.step);
      if (!it) return;
      it.qty += Number(step.dataset.dir);
      if (it.qty <= 0) items.delete(step.dataset.step);
      render();
    } else if (rm) {
      items.delete(rm.dataset.rm);
      render();
    }
  });

  document.getElementById('clear').addEventListener('click', () => { items.clear(); render(); });
  render();
</script>
</body>
</html>
